---
AWSTemplateFormatVersion: '2010-09-09'
Description: CrowdStrike Cloud-Security (CSPM) Registration Template for registration to multiple Falcon CIDs
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: 
          default: Multi-CID Configuration
        Parameters:
          - CIDA
          - OUA
          - FalconClientIdA
          - FalconSecretA
          - FalconCloudA
          - CIDB
          - OUB
          - FalconClientIdB
          - FalconSecretB
          - FalconCloudB
      - Label:
          default: CSPM Configuration
        Parameters:
          - EnableAssetInventory
          - EnableIOA
          - EnableIDP
          - EnableDSPM
          - EnableVulnerabilityScanning
          - EnableSensorManagement
          - UseExistingCloudTrail
          - LogIngestionMethod
          - RealtimeVisibilityRegions
          - DSPMRegions
          - APICredentialsStorageMode
          - NestedOUs
          - Regions
      - Label:
          default: Advanced Configuration
        Parameters:
          - PermissionsBoundary
          - ResourcePrefix
          - ResourceSuffix
      - Label: 
          default: StackSet Configuration
        Parameters:
          - StackSetAdminRole
          - StackSetExecRole
      - Label: 
          default: Misc
        Parameters:
          - S3Bucket
          - AWSAccountType
          - RootOU

Conditions:
  HasOUA: !Not [!Equals [!Ref OUA, '']]
  HasOUB: !Not [!Equals [!Ref OUB, '']]
  HasBothOUs: !And [!Condition HasOUA, !Condition HasOUB]
  HasEitherOU: !Or [!Condition HasOUA, !Condition HasOUB]

Parameters:
  StackSetAdminRole:
    Description: Administration Role for CrowdStrike Root EB StackSet
    Type: String
    Default: 'CrowdStrikeStackSetAdministrationRole'
  StackSetExecRole:
    Description: Execution Role for CrowdStrike Root EB StackSet
    Type: String
    Default: 'CrowdStrikeStackSetExecutionRole'
  OUA:
    Description: List of OUs for FalconClientIdA & FalconSecretA (required for primary CID).
    Type: String
  CIDA:
    Description: Falcon CID for OUA, FalconClientIdA & FalconSecretA (required for primary CID).
    Type: String
  FalconClientIdA:
    Description: Your CrowdStrike Falcon OAuth2 Client ID for OUA (required for primary CID).
    NoEcho: 'true'
    Type: String
  FalconSecretA:
    Description: Your CrowdStrike Falcon OAuth2 API Secret for OUA (required for primary CID).
    NoEcho: 'true'
    Type: String
  FalconCloudA:
    Description: Your CrowdStrike Falcon Cloud for OUA.
    Type: String
    Default: 'us1'
    AllowedValues:
      - 'us1'
      - 'us2'
      - 'eu1'
      - 'usgov1'
      - 'usgov2'
  OUB:
    Description: List of OUs for FalconClientIdB & FalconSecretB.
    Type: String
    Default: ''
  CIDB:
    Description: Falcon CID for OUB, FalconClientIdB & FalconSecretB.
    Type: String
    Default: ''
  FalconClientIdB:
    Description: Your CrowdStrike Falcon OAuth2 Client ID for OUB.
    NoEcho: 'true'
    Type: String
    Default: ''
  FalconSecretB:
    Description: Your CrowdStrike Falcon OAuth2 API Secret for OUB.
    NoEcho: 'true'
    Type: String
    Default: ''
  FalconCloudB:
    Description: Your CrowdStrike Falcon Cloud for OUB.
    Type: String
    Default: 'us1'
    AllowedValues:
      - 'us1'
      - 'us2'
      - 'eu1'
      - 'usgov1'
      - 'usgov2'
  UseExistingCloudTrail:
    Type: String
    Description: Choose False to Create CloudTrail for Read-Only Indicators of Attack.
    AllowedValues:
      - 'True'
      - 'False'
    Default: 'True'
  EnableIDP:
    Type: String
    Description: Enable Identity Protection.
    AllowedValues:
      - 'True'
      - 'False'
    Default: 'True'
  EnableIOA:
    Type: String
    Description: Choose True to enable Indicators of Attack.
    AllowedValues:
      - 'True'
      - 'False'
    Default: 'True'
  EnableSensorManagement:
    Type: String
    AllowedValues:
      - 'True'
      - 'False'
    Default: 'False'
  S3Bucket:
    Type: String
    Default: ''
  AWSAccountType:
    Type: String
    AllowedValues:
      - 'commercial'
      - 'govcloud'
    Default: 'commercial'
  APICredentialsStorageMode:
    Type: String
    Description: How Falcon API credentials are stored. 'lambda' stores them in the lambda environment variables, 'secret' in an AWS secret
    Default: secret
    AllowedValues: ["lambda", "secret"]
  NestedOUs:
    Type: String
    Description: Choose True to register accounts in nested OUs under the provided OUs. Choose False to only register direct children of provided OUs.
    AllowedValues:
      - 'True'
      - 'False'
    Default: 'True'
  RootOU:
    Type: String
    Description: (Optional/Legacy) Root OU - StackSet roles now deploy to specific OUs (OUA/OUB) instead of root OU.
    Default: ''
  Regions:
    Type: String
    Description: (Commercial-to-GovCloud only) Regions for EB/IOA StackSets.
    Default: ''
  EnableAssetInventory:
    Type: String
    Description: Enable Asset Inventory (CSPM)
    AllowedValues:
      - 'True'
      - 'False'
    Default: 'True'
  EnableDSPM:
    Type: String
    Description: Enable DSPM (Data Security Posture Management)
    AllowedValues:
      - 'True'
      - 'False'
    Default: 'False'
  EnableVulnerabilityScanning:
    Type: String
    Description: Enable Vulnerability Scanning
    AllowedValues:
      - 'True'
      - 'False'
    Default: 'False'
  PermissionsBoundary:
    Type: String
    Description: IAM Permission Boundary Policy Name (optional)
    Default: ''
  ResourcePrefix:
    Type: String
    Description: Prefix for resource names created by cs_aws_root.yaml
    Default: 'CrowdStrike-'
  ResourceSuffix:
    Type: String
    Description: Suffix for resource names created by cs_aws_root.yaml
    Default: ''
  LogIngestionMethod:
    Type: String
    Description: Method for ingesting CloudTrail logs - EventBridge or S3
    AllowedValues:
      - 'eventbridge'
      - 's3'
    Default: 'eventbridge'
  RealtimeVisibilityRegions:
    Type: String
    Description: Comma-separated list of regions for Realtime Visibility (leave empty for all opted-in regions)
    Default: ''
  DSPMRegions:
    Type: String
    Description: Comma-separated list of regions to enable DSPM/Agentless Scanning (required if EnableDSPM or EnableVulnerabilityScanning is True)
    Default: ''

Resources:
  # IAM Role to allow StackSet Administration
  StackSetAdministrationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref StackSetAdminRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          Action: sts:AssumeRole
          Principal:
            Service: cloudformation.amazonaws.com
          Effect: Allow
          Sid: ''
      Policies:
        - PolicyName: crowdstrike-stackset-execution
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Action: sts:AssumeRole
                Resource: !Sub arn:${AWS::Partition}:iam::*:role/${StackSetExecRole}
                Effect: Allow
  # IAM Role to allow StackSet Execution
  StackSetExecutionRole:
    Type: AWS::IAM::Role
    DependsOn: StackSetAdministrationRole
    Properties:
      RoleName: !Ref StackSetExecRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          Action: sts:AssumeRole
          Principal:
            AWS: !GetAtt StackSetAdministrationRole.Arn
          Effect: Allow
          Sid: ''
      Policies:
        - PolicyName: crowdstrike-stackset-execution
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Action:
                - events:DeleteRule
                - events:PutTargets
                - events:DescribeRule
                - iam:PassRole
                - events:EnableRule
                - events:PutRule
                - events:RemoveTargets
                - events:DisableRule
                Resource:
                - !Sub arn:${AWS::Partition}:events:*:*:rule/cs-*
                - !Sub arn:${AWS::Partition}:events:*:*:rule/*/cs-*
                - !Sub arn:${AWS::Partition}:iam::*:role/CrowdStrike*
                Effect: Allow
              - Action: cloudformation:*
                Resource: '*'
                Effect: Allow
              - Action: secretsmanager:*
                Resource: !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/CrowdStrike/CSPM/SensorManagement/FalconAPICredentials-*'
                Effect: Allow
              - Action:
                - iam:GetRole
                - iam:CreateRole
                - iam:DeleteRole
                - iam:CreatePolicy
                - iam:DeletePolicy
                - iam:PutRolePolicy
                - iam:DeleteRolePolicy
                - iam:DetachRolePolicy
                - iam:AttachRolePolicy
                - iam:UntagPolicy
                - iam:UntagRole
                - iam:TagRole
                - iam:TagPolicy
                Resource: '*'
                Effect: Allow
              - Action:
                - lambda:CreateFunction
                - lambda:DeleteFunction
                - lambda:CreateAlias
                - lambda:DeleteAlias
                - lambda:AddPermission
                - lambda:RemovePermission
                - lambda:InvokeFunction
                - lambda:GetFunction
                - lambda:TagResource
                - lambda:UntagResource
                Resource: '*'
                Effect: Allow
              - Action:
                - logs:CreateLogGroup
                - logs:DeleteLogGroup
                - logs:PutRetentionPolicy
                - logs:DeleteRetentionPolicy
                - logs:TagResource
                - logs:TagLogGroup
                - logs:UntagLogGroup
                - logs:UntagResource
                Resource: '*'
                Effect: Allow
              - Action:
                - s3:GetObject
                - s3:DeleteObject
                - s3:PutObject
                - s3:CreateBucket
                - s3:DeleteBucket
                - s3:PutBucketPolicy
                - s3:DeleteBucketPolicy
                - s3:PutObjectTagging
                - s3:PutBucketTagging
                - s3:TagResource
                - s3:UntagResource
                Resource: '*'
                Effect: Allow

  # StackSet to create roles for stackset execution
  StackSetRoleSetup:
    Type: AWS::CloudFormation::StackSet
    Condition: HasEitherOU
    Properties:
      AutoDeployment: 
        Enabled: true
        RetainStacksOnAccountRemoval: false
      Capabilities: 
        - CAPABILITY_NAMED_IAM
      Description: Create roles to allow CrowdStrike StackSet Execution in specified OUs
      OperationPreferences: 
        FailureTolerancePercentage: 100
        MaxConcurrentPercentage: 100
      Parameters:
        - ParameterKey: StackSetExecRole
          ParameterValue: !Ref StackSetExecRole
        - ParameterKey: StackSetAdminRole
          ParameterValue: !GetAtt StackSetAdministrationRole.Arn
      PermissionModel: SERVICE_MANAGED
      StackInstancesGroup: !If
        - HasBothOUs
        - - DeploymentTargets:
              AccountFilterType: NONE
              OrganizationalUnitIds: !Split [',', !Ref OUA]
            Regions:
              - !Ref AWS::Region
          - DeploymentTargets:
              AccountFilterType: NONE
              OrganizationalUnitIds: !Split [',', !Ref OUB]
            Regions:
              - !Ref AWS::Region
        - !If
          - HasOUA
          - - DeploymentTargets:
                AccountFilterType: NONE
                OrganizationalUnitIds: !Split [',', !Ref OUA]
              Regions:
                - !Ref AWS::Region
          - - DeploymentTargets:
                AccountFilterType: NONE
                OrganizationalUnitIds: !Split [',', !Ref OUB]
              Regions:
                - !Ref AWS::Region
      StackSetName: crowdstrike-stackset-role-setup
      TemplateURL: !Sub https://${S3Bucket}.s3.amazonaws.com/crowdstrike_stackset_role_setup.yml

  # IAM Role for Lambda Function Execution
  LambdaCrowdStrikeRegistrationRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
            Condition: { }
      Path: /
      Policies:
        - PolicyName: CrowdStrikeApiSecretPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - 'secretsmanager:GetSecretValue'
                Resource:
                  - !Sub 'arn:${AWS::Partition}:secretsmanager:*:*:secret:CrowdStrikeAPISecret-*'
              - Effect: Allow
                Action:
                  - 'ec2:DescribeRegions'
                Resource: '*'
        - PolicyName: crowdstrike-stackset-execution
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Action:
                - iam:PassRole
                - cloudformation:CreateStackInstances
                - cloudformation:CreateStackSet
                - cloudformation:TagResource
                - cloudformation:UpdateStackInstances
                - cloudformation:UpdateStackSet
                - cloudformation:ListStackSets
                - cloudformation:ListStackInstances
                Resource:
                - !Sub arn:${AWS::Partition}:cloudformation:*:*:stackset/CrowdStrike-Cloud-Security*
                - !GetAtt StackSetAdministrationRole.Arn
                Effect: Allow
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AWSOrganizationsReadOnlyAccess'
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonS3ReadOnlyAccess'
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonEC2ReadOnlyAccess'
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AWSCloudFormationReadOnlyAccess'

  # Lambda Function to register and onboard accounts
  RegisterAccountsLambda:
    Type: AWS::Lambda::Function
    DependsOn:
      - CrowdStrikeSecretA
      - StackSetRoleSetup
    Properties:
      Environment:
        Variables:
          existing_cloudtrail: !Ref UseExistingCloudTrail
          sensor_management: !Ref EnableSensorManagement
          credentials_storage: !Ref APICredentialsStorageMode
          aws_account_type: !Ref AWSAccountType
          current_region: !Ref AWS::Region
          admin_role: !GetAtt StackSetAdministrationRole.Arn
          exec_role: !Ref StackSetExecRole
          enable_ioa: !Ref EnableIOA
          s3_bucket: !Ref S3Bucket
          regions: !Ref Regions
          accounts: 'auto'
          secret: 'auto'
          secret_list: !If
            - HasOUB
            - !Join [ ",", [ !Ref CrowdStrikeSecretA, !Ref CrowdStrikeSecretB ] ]
            - !Ref CrowdStrikeSecretA
          parent_stack: !Ref AWS::StackName
          identity_protection: !Ref EnableIDP
          nested_ous: !Ref NestedOUs
          enable_asset_inventory: !Ref EnableAssetInventory
          enable_dspm: !Ref EnableDSPM
          enable_vulnerability_scanning: !Ref EnableVulnerabilityScanning
          permissions_boundary: !Ref PermissionsBoundary
          resource_prefix: !Ref ResourcePrefix
          resource_suffix: !Ref ResourceSuffix
          log_ingestion_method: !Ref LogIngestionMethod
          realtime_visibility_regions: !Ref RealtimeVisibilityRegions
          dspm_regions: !Ref DSPMRegions
      Handler: lambda_function.lambda_handler
      MemorySize: 128
      Role: !GetAtt "LambdaCrowdStrikeRegistrationRole.Arn"
      Runtime: python3.11
      Timeout: 900
      FunctionName: crowdstrike-multi-cid-registration
      Code:
        S3Bucket: !Ref S3Bucket
        S3Key: init_lambda_function.zip

  UpdateStackSetsLambda:
    Type: AWS::Lambda::Function
    DependsOn:
      - StackSetRoleSetup
    Properties:
      Environment:
        Variables:
          admin_role_arn: !GetAtt StackSetAdministrationRole.Arn
          exec_role_arn: !Ref StackSetExecRole
          parent_stack: !Ref AWS::StackName
      Handler: lambda_function.lambda_handler
      MemorySize: 128
      Role: !GetAtt "LambdaCrowdStrikeRegistrationRole.Arn"
      Runtime: python3.11
      Timeout: 900
      FunctionName: crowdstrike-multi-cid-update-stacksets
      Code:
        S3Bucket: !Ref S3Bucket
        S3Key: update_lambda_function.zip

  # Trigger Lambda Function
  # TriggerRegisterAccountsLambda:
  #   Type: 'Custom::TriggerLambda'
  #   DependsOn:
  #     - RegisterAccountsLambda
  #   Properties:
  #     ServiceToken: !GetAtt
  #       - RegisterAccountsLambda
  #       - Arn

  # Create Secrets for registration lambda
  CrowdStrikeSecretA:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: CrowdStrike Credentials
      Name: CrowdStrikeAPISecret-A
      SecretString:
        Fn::Join:
          - ''
          - - '{"FalconClientId":"'
            - Ref: "FalconClientIdA"
            - '","FalconSecret": "'
            - Ref: FalconSecretA
            - '","FalconCloud": "'
            - Ref: FalconCloudA
            - '","OUs": "'
            - Ref: OUA
            - '","CID": "'
            - Ref: CIDA
            - '"}'
  CrowdStrikeSecretB:
    Condition: HasOUB
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: CrowdStrike Credentials
      Name: CrowdStrikeAPISecret-B
      SecretString:
        Fn::Join:
          - ''
          - - '{"FalconClientId":"'
            - Ref: "FalconClientIdB"
            - '","FalconSecret": "'
            - Ref: FalconSecretB
            - '","FalconCloud": "'
            - Ref: FalconCloudB
            - '","OUs": "'
            - Ref: OUB
            - '","CID": "'
            - Ref: CIDB
            - '"}'

  # Auto register
  CreateAccountRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Trigger lambda when accounts are created.
      EventPattern:
        source:
          - "aws.organizations"
        detail-type:
          - "AWS API Call via CloudTrail"
        detail:
          eventSource:
            - "organizations.amazonaws.com"
          eventName:
            - "MoveAccount"
      Name: cs-multi-cid-trigger
      State: ENABLED
      Targets: 
        - Id: trigger-multi-cid-lambda
          Arn: !GetAtt RegisterAccountsLambda.Arn

  InvokeLambdaPermission: 
    Type: AWS::Lambda::Permission
    DependsOn: RegisterAccountsLambda
    Properties: 
      FunctionName: !Ref RegisterAccountsLambda
      Action: "lambda:InvokeFunction"
      Principal: "events.amazonaws.com"
      SourceArn: !GetAtt CreateAccountRule.Arn
